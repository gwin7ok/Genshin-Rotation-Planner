# 検査（型・確認スクリプト）。プルリクエストと main への push で動かす。
#
# gcsim の WebAssembly 版（public/gcsim/main.wasm。Git 管理外）を使わない検査だけを動かす（高速・ネットワーク不要）。
#   動かさないもの: check:hitlag・check:sacrificial-seed・check:dps・check:required-er（gcsim の実行が要る）、check:release（WASM が要る。deploy.yml が動かす）
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 依存関係
        run: npm ci

      - name: 型の検査
        run: npm run lint

      - name: バックアップの往復の確認
        run: npm run check:backup

      - name: 編成の中身の検査の確認
        run: npm run check:rotation-validation

      - name: マスターデータ取得の通信の確認
        run: npm run check:fetch-util

      - name: Go の算術式の評価の確認
        run: npm run check:go-expr

      - name: WASM のビルド元の確認の確認
        run: npm run check:wasm-source

      - name: グループ化の確認
        run: npm run check:groups

      - name: 効果のキーの扱いの確認
        run: npm run check:effects

      - name: 更新の通知の判定の確認
        run: npm run check:version-notice

      - name: 計算結果のスナップショットの確認
        run: npm run check:snapshots

      - name: アクションの紐付けの確認
        run: npm run check:action-links

      - name: CT のログの確認
        run: npm run check:cooldown-log

      - name: 効果キーの網羅の確認
        run: npm run verify:effectkeys

      - name: マスターの効果の網羅の確認
        run: npm run verify:master-effects

      - name: gcsim の取り込みの確認
        run: npm run check:gcsim-import

      # check:hoyolab-import は、CI では実行しない（ご自身の HoYoLAB の取得データ tools/hoyolab-fetch/out/hoyolab-raw.json と、
      # WebAssembly 版の main.wasm が要る。Git に入らないデータなので、手元でだけ実行する）

      - name: 持ちキャラの照合の確認
        run: npm run check:owned-match

      - name: 持ちキャラの統合の確認
        run: npm run check:owned-merge

      - name: URL 取り込みの確認
        run: npm run check:url-import

      - name: 拡張機能の manifest（Chrome 用・Firefox 用）・署名済み xpi の取得の確認
        run: npm run check:extension-manifest

      - name: 拡張機能の案内の出し分け（ブラウザの判定）の確認
        run: npm run check:browser-detect

      - name: CT 違反・警告の印の一覧と、ヘッダーの ▲▼ の「前・次」の選び方の確認
        run: npm run check:ct-marks

      - name: CT バーの「CT 残り秒数」（ゲーム画面に合わせた切り下げ）の確認
        run: npm run check:ct-remaining

      - name: 言語ファイルの確認（未訳が残っていれば失敗）
        run: npm run check:i18n -- --strict
