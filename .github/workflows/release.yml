# リリースの生成（タグ起点）。VSCode の ctrl+shift+3（release-tag-and-push-short）が、タグ vX.Y.Z を push すると起動する。
#
# 流れ: 版の検証（タグ = package.json の version / タグのコミットが main に含まれる）
#       → CHANGELOG.md から、その版の節を抽出 → GitHub Release を作成
#       → HoYoLAB 取り込みの拡張機能: Chrome 用の zip を添付。Firefox 用は、その版が未署名なら、AMO（非公開 = unlisted）で署名して、
#         署名済みの xpi を添付（鍵は Secrets の AMO_JWT_ISSUER・AMO_JWT_SECRET。docs/リリース手順.md の「Firefox 版の拡張機能」）
#       → deploy（GitHub Pages への公開）を、main から起動（タグのチェックアウトを指定）。deploy が、署名済みの xpi を公開サイトに同梱する
#         （署名のあとに deploy を起動するので、更新用 JSON が、まだ無い xpi を指すことはない。署名が失敗しても、deploy は起動し、
#         最後に、この job を失敗として表示する）
#
# なぜ deploy を別ワークフローから起動するか:
#   `github-pages` 環境は、既定で main ブランチからのデプロイだけを許可する（タグのままでは拒否される）。
#   そのため、タグの push で起動した、この workflow が、`gh workflow run deploy.yml --ref main -f ref=<タグ>` で、
#   main の上で deploy を実行する（環境の保護ルールを変えずに済む）。GITHUB_TOKEN による workflow_dispatch は、許可されている。
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 拡張機能のパック（scripts/pack-extension.ts）は、Node の型の取り除き（22.18 以降）で動く。依存パッケージは要らない
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 版の検証（タグ = package.json の version）
        id: ver
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::タグが vX.Y.Z の形ではありません: $tag"; exit 1
          fi
          v="${BASH_REMATCH[1]}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$pkg" != "$v" ]; then
            echo "::error::タグの版 ($v) が package.json の version ($pkg) と違います"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: タグのコミットが main に含まれることの確認
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::タグのコミットが main に含まれていません（main に push してから、タグを付けてください）"; exit 1
          fi

      - name: 変更履歴の抽出（CHANGELOG.md の該当の版）
        run: |
          v="${{ steps.ver.outputs.version }}"
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            const raw = fs.readFileSync("CHANGELOG.md", "utf8").replace(/\r\n/g, "\n");
            const lines = raw.split("\n");
            const i = lines.findIndex(l => l.startsWith("## [" + v + "]"));
            if (i < 0) { console.error("CHANGELOG.md に、版 " + v + " の節がありません"); process.exit(1); }
            const out = [];
            for (let j = i + 1; j < lines.length; j++) {
              if (/^## \[/.test(lines[j]) || /^\[[^\]]+\]: /.test(lines[j])) break;
              out.push(lines[j]);
            }
            const body = out.join("\n").trim();
            if (!body) { console.error("版 " + v + " の変更履歴が空です"); process.exit(1); }
            fs.writeFileSync("changes.md", body + "\n");
          ' "$v"
          echo "----- リリースノート -----"; cat changes.md

      - name: GitHub Release の作成
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag は、すでにあります（作り直しません）"
          else
            gh release create "$tag" --title "$tag" --notes-file changes.md --verify-tag
          fi

      - name: HoYoLAB 取り込みの拡張機能の zip を、Release に添付
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 拡張機能（extension/hoyolab-importer）を zip にして、Release に添付する。利用者は、展開して「パッケージ化されていない拡張機能を読み込む」で導入する
          ev=$(node -p "require('./extension/hoyolab-importer/manifest.json').version")
          zip_name="grp-hoyolab-importer-${ev}.zip"
          (cd extension/hoyolab-importer && zip -r "../../${zip_name}" . -x "README.md")
          gh release upload "${GITHUB_REF_NAME}" "${zip_name}" --clobber
          echo "拡張機能 ${zip_name} を添付しました"

      # 署名が失敗しても、アプリの公開（deploy）は止めない（Firefox 版のためだけに、アプリの更新が出せなくなるのを避ける）。
      # 失敗は、いちばん最後の手順で、この job の失敗（赤）として表示する
      - name: Firefox 版の拡張機能を、AMO（非公開 = unlisted）で署名して、Release に添付
        id: sign
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          ev=$(node -p "require('./extension/hoyolab-importer/manifest.json').version")
          xpi_name="grp-hoyolab-importer-${ev}.xpi"
          # AMO は、同じ版を、署名し直せない。どれかの Release に、この版の署名済みファイルがあれば、飛ばす
          # （拡張機能の中身を変えたときは、manifest.json の version を上げる。docs/リリース手順.md）
          if gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].assets[].name' | grep -qx "${xpi_name}"; then
            echo "拡張機能 v${ev} は、署名済みです（${xpi_name}）。署名を飛ばします"
            exit 0
          fi
          # 鍵（Secrets）が未登録のときは、署名だけ飛ばして、リリースは続ける（Firefox 版は、鍵を登録してから、版を上げて出す）
          if [ -z "${AMO_JWT_ISSUER}" ] || [ -z "${AMO_JWT_SECRET}" ]; then
            echo "::warning::Secrets の AMO_JWT_ISSUER / AMO_JWT_SECRET が未登録のため、Firefox 版の署名を飛ばしました（docs/リリース手順.md の「Firefox 版の拡張機能」）"
            exit 0
          fi
          npm run ext:pack
          npx --yes web-ext@8 sign \
            --source-dir build/extension/firefox \
            --artifacts-dir build/extension/signed \
            --channel unlisted \
            --api-key "${AMO_JWT_ISSUER}" \
            --api-secret "${AMO_JWT_SECRET}"
          signed=(build/extension/signed/*.xpi)
          if [ "${#signed[@]}" -ne 1 ] || [ ! -f "${signed[0]}" ]; then
            echo "::error::署名済みの xpi が、ちょうど 1 つ（build/extension/signed/）に、できていません"; exit 1
          fi
          mv "${signed[0]}" "build/extension/signed/${xpi_name}"
          gh release upload "${GITHUB_REF_NAME}" "build/extension/signed/${xpi_name}" --clobber
          echo "Firefox 版の拡張機能 ${xpi_name} を署名して添付しました"

      - name: deploy（GitHub Pages への公開）を main から起動
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy.yml --ref main -f ref="${GITHUB_REF_NAME}"
          echo "deploy を起動しました（タグ ${GITHUB_REF_NAME} をビルドして公開します）"

      - name: Firefox 版の署名の失敗を、この job の失敗として表示
        if: steps.sign.outcome == 'failure'
        run: |
          echo "::error::Firefox 版の拡張機能の署名に失敗しました（アプリの公開 = deploy は、起動済みです）。署名の手順のログを確認してください（docs/リリース手順.md の「失敗したとき」）"
          exit 1
